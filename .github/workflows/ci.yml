name: MATLAB CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
          products: Statistics_and_Machine_Learning_Toolbox
      - name: Code Analyzer
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('tools'); check_matlab
      - name: Tests
        uses: matlab-actions/run-tests@v3
        with:
          source-folder: pricing
          select-by-folder: tests
      - name: Reproduce seed-42 example
        uses: matlab-actions/run-command@v3
        with:
          command: reproduce_example
